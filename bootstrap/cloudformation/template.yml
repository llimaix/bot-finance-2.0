AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  bot-finance - bootstrap: bucket S3 del state de Terraform, permissions boundary
  y rol de GitHub Actions (reutiliza el OIDC provider existente de la cuenta).

Parameters:
  ProjectName:
    Type: String
    Default: bot-finance
    AllowedValues: [bot-finance]
    Description: Prefijo de los recursos; fijo porque bucket, rol y boundary tienen nombre fijo
  Environment:
    Type: String
    Default: prod
  GitHubOwner:
    Type: String
    Default: llimaix
  GitHubOwnerId:
    Type: String
    Default: '158865846'
    Description: ID numérico del owner (sub inmutable de GitHub OIDC)
  GitHubRepo:
    Type: String
    Default: bot-finance-2.0
  GitHubRepoId:
    Type: String
    Default: '1466256001'
    Description: ID numérico del repo (cambia si el repo se recrea)
  DeployBranch:
    Type: String
    Default: main
  SiteDomain:
    Type: String
    Default: financebot.isdomana.com
    AllowedPattern: '^[a-z0-9.-]+[a-z0-9]$'
    Description: Dominio de la Mini App (CloudFront + ACM), en minúsculas y sin punto final
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Hosted zone pública de Route 53 que contiene SiteDomain (sin el prefijo /hostedzone/)
  ManageStateResources:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      false solo para recrear la pila cuando el bucket del state y el boundary ya
      existen (sobreviven al borrado); después se importan con un change set
      IMPORT y este valor vuelve a true.

Conditions:
  ManageState: !Equals [!Ref ManageStateResources, 'true']

Resources:
  # ── State de Terraform ────────────────────────────────────────────────
  # Nombres FIJOS en bucket, boundary y rol: el resto de la plantilla los
  # referencia por ARN para no depender de ManageStateResources (el bucket y el
  # boundary sobreviven al borrado de la pila y se re-importan).
  TfStateBucket:
    Type: AWS::S3::Bucket
    Condition: ManageState
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: bot-finance-tfstate
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expirar-versiones-antiguas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: Component, Value: tfstate }

  TfStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: bot-finance-tfstate
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - 'arn:aws:s3:::bot-finance-tfstate'
              - 'arn:aws:s3:::bot-finance-tfstate/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ── Techo de permisos para todo rol que cree Terraform ─────────────────
  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: ManageState
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: boundary-bot-finance
      Description: Techo de permisos de los roles creados por Terraform para bot-finance
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*:*'
          - Sid: DynamoData
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:DescribeTable
            Resource:
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*/index/*'
          - Sid: ReadOwnSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
          - Sid: TranscribeStreaming
            Effect: Allow
            Action: transcribe:StartStreamTranscription
            Resource: '*'
          - Sid: InvokeOwnLambdas
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
          - Sid: KillSwitchOnly
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
            Condition:
              ArnEquals:
                'iam:PolicyARN': !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${ProjectName}-kill-switch'

  # ── Rol que asume GitHub Actions ───────────────────────────────────────
  GitHubActionsRole:
    Type: AWS::IAM::Role
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: github-actions-bot-finance
      Description: !Sub 'Rol OIDC de GitHub Actions para ${GitHubOwner}/${GitHubRepo} (rama ${DeployBranch})'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${DeployBranch}'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: Component, Value: ci-cd }
      Policies:
        - PolicyName: terraform-state
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: 'arn:aws:s3:::bot-finance-tfstate'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: 'arn:aws:s3:::bot-finance-tfstate/*'
        - PolicyName: workload-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
              - Sid: DynamoDB
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*/*'
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*:*'
              - Sid: ReadOnlyGlobal
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - cloudwatch:DescribeAlarms
                  - ce:ListCostAllocationTags
                  - ce:UpdateCostAllocationTagsStatus
                Resource: '*'
              - Sid: SecretsMetadataOnly
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:RestoreSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:PutResourcePolicy
                  - secretsmanager:DeleteResourcePolicy
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
              - Sid: ReadTelegramSecretForWebhookRegistration
                # Solo para el workflow manual telegram-webhook.yml (setWebhook).
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/telegram-??????'
              - Sid: ApiGatewayV2
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource:
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/*'
                  - !Sub 'arn:aws:apigateway:${AWS::Region}::/tags/*'
              - Sid: Scheduler
                Effect: Allow
                Action: scheduler:*
                Resource:
                  - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${ProjectName}'
                  - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ProjectName}/*'
              - Sid: Sns
                Effect: Allow
                Action: sns:*
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*'
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectName}-*'
              - Sid: Budgets
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:CreateBudgetAction
                  - budgets:UpdateBudgetAction
                  - budgets:DeleteBudgetAction
                  - budgets:DescribeBudgetAction
                  - budgets:DescribeBudgetActionsForBudget
                  - budgets:ListTagsForResource
                  - budgets:TagResource
                  - budgets:UntagResource
                Resource:
                  - !Sub 'arn:aws:budgets::${AWS::AccountId}:budget/${ProjectName}-*'
                  - !Sub 'arn:aws:budgets::${AWS::AccountId}:budget/${ProjectName}-*/action/*'
        - PolicyName: iam-bounded
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateRolesOnlyWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  ArnEquals:
                    'iam:PermissionsBoundary': !Sub 'arn:aws:iam::${AWS::AccountId}:policy/boundary-bot-finance'
              - Sid: ManageOwnRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
              - Sid: ManageOwnPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${ProjectName}-*'
              - Sid: PassOwnRolesToServices
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    'iam:PassedToService':
                      - lambda.amazonaws.com
                      - scheduler.amazonaws.com
                      - budgets.amazonaws.com
              - Sid: NeverRemoveBoundary
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'

  # ── Permisos de la Mini App (S3, CloudFront, ACM y Route 53) ─────────────
  # Managed policy (no inline): las inline del rol tienen un límite conjunto
  # de 10 240 caracteres.
  MiniAppDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-miniapp'
      Description: S3, CloudFront, ACM y Route 53 de la Mini App para el rol de GitHub Actions
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SiteBucket
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:aws:s3:::${ProjectName}-miniapp-*'
              - !Sub 'arn:aws:s3:::${ProjectName}-miniapp-*/*'
          - Sid: CloudFront
            # CloudFront no permite acotar la creación por nombre: las
            # distribuciones, OAC y políticas se crean sobre '*'.
            Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:CreateDistributionWithTags
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:UpdateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:ListTagsForResource
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
              - cloudfront:CreateOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginAccessControlConfig
              - cloudfront:UpdateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:ListOriginAccessControls
              - cloudfront:CreateResponseHeadersPolicy
              - cloudfront:GetResponseHeadersPolicy
              - cloudfront:GetResponseHeadersPolicyConfig
              - cloudfront:UpdateResponseHeadersPolicy
              - cloudfront:DeleteResponseHeadersPolicy
              - cloudfront:ListResponseHeadersPolicies
              - cloudfront:GetCachePolicy
              - cloudfront:ListCachePolicies
              - cloudfront:GetOriginRequestPolicy
              - cloudfront:ListOriginRequestPolicies
            Resource: '*'
          - Sid: AcmRequestTagged
            Effect: Allow
            Action:
              - acm:RequestCertificate
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref ProjectName
          - Sid: AcmRead
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:ListTagsForCertificate
            Resource: !Sub 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/*'
          - Sid: AcmManageOwn
            Effect: Allow
            Action:
              - acm:AddTagsToCertificate
              - acm:RemoveTagsFromCertificate
              - acm:DeleteCertificate
            Resource: !Sub 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref ProjectName
          - Sid: Route53Read
            Effect: Allow
            Action:
              - route53:ListHostedZones
              - route53:ListHostedZonesByName
              - route53:GetChange
            Resource: '*'
          - Sid: Route53Zone
            Effect: Allow
            Action:
              - route53:GetHostedZone
              - route53:ListResourceRecordSets
              - route53:ListTagsForResource
            Resource: !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
          - Sid: Route53OnlySiteRecords
            # Solo el alias del sitio y la validación DNS de ACM.
            Effect: Allow
            Action: route53:ChangeResourceRecordSets
            Resource: !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
            Condition:
              'ForAllValues:StringLike':
                'route53:ChangeResourceRecordSetsNormalizedRecordNames':
                  - !Ref SiteDomain
                  - !Sub '_*.${SiteDomain}'
          # Ni el propio pipeline puede invocar la API saltándose CloudFront.
          - Sid: DenyDirectMiniAppApi
            Effect: Deny
            Action: lambda:InvokeFunctionUrl
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-miniapp'

Outputs:
  TfStateBucketName:
    Value: bot-finance-tfstate
    Export:
      Name: !Sub '${ProjectName}-tfstate-bucket'
  GitHubActionsRoleArn:
    Description: Valor para el secret AWS_ROLE_ARN del repo
    Value: !GetAtt GitHubActionsRole.Arn
  WorkloadBoundaryArn:
    Description: Boundary obligatorio para los roles que cree Terraform
    Value: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/boundary-bot-finance'
  MiniAppDeployPolicyArn:
    Description: Permisos de la Mini App adjuntos al rol de GitHub Actions
    Value: !Ref MiniAppDeployPolicy
