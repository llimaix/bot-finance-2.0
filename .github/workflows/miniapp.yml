name: miniapp

# Build y despliegue del frontend de la Mini App: S3 privado + invalidación de
# CloudFront. El bucket y la distribución salen del state de Terraform (root
# miniapp-web, solo lectura de outputs).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/lib/miniapp/contract.ts'
      - '.github/workflows/miniapp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miniapp-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sin `environment:`: cambiaría el sub OIDC y el rol solo confía en refs/heads/main.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miniapp-dist
          path: dist

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: miniapp-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - id: site
        working-directory: infra/live/miniapp-web
        run: |
          set -euo pipefail
          terraform init -lockfile=readonly >/dev/null
          echo "bucket=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"

      # Assets con hash: caché de un año. index.html: siempre revalidar, así un
      # despliegue se ve de inmediato y los assets viejos siguen sirviendo.
      - name: Subir a S3
        env:
          BUCKET: ${{ steps.site.outputs.bucket }}
        run: |
          set -euo pipefail
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidar index.html en CloudFront
        env:
          DISTRIBUTION: ${{ steps.site.outputs.distribution }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths /index.html \
            --query 'Invalidation.{id:Id,estado:Status}' --output table
