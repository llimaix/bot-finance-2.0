name: lambdas

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/lambdas.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funciones separadas por espacio: webhook processor reminder monthly-report (vacío = todas)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: lambdas-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: bot-finance
  NODE_VERSION: '24'
  FUNCTIONS: webhook processor reminder monthly-report

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FUNCTIONS: ${{ inputs.functions }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_FUNCTIONS" ]; then selected="$FUNCTIONS"; else
              selected=""
              for f in $FUNCTIONS; do for i in $INPUT_FUNCTIONS; do [ "$f" = "$i" ] && selected="$selected $f"; done; done
            fi
          elif [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            selected="$FUNCTIONS"   # rama nueva o force push: no hay base fiable para comparar
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            if echo "$changed" | grep -qE '^(\.github/workflows/lambdas\.yml|backend/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|scripts/build\.mjs))$'; then
              selected="$FUNCTIONS"
            else
              # Rutas relativas a backend/, igual que las del metafile de esbuild.
              backend_changed=$(echo "$changed" | sed -n 's#^backend/##p')
              selected=""
              if [ -n "$backend_changed" ]; then
                for f in $FUNCTIONS; do
                  if jq -r '.inputs | keys[]' "dist/$f/meta.json" | grep -Fqx -f <(printf '%s\n' "$backend_changed"); then
                    selected="$selected $f"
                  fi
                done
              fi
            fi
          fi

          selected=$(echo $selected)
          if [ -z "$selected" ]; then
            matrix='[]'; count=0
          else
            matrix=$(printf '%s\n' $selected | jq -R . | jq -cs .)
            count=$(echo "$matrix" | jq length)
            for f in $selected; do (cd "dist/$f" && zip -X -q "../$f.zip" index.mjs); done
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Funciones a desplegar: ${selected:-ninguna}"

      - if: steps.detect.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambdas-${{ github.run_id }}
          path: backend/dist/*.zip
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy (${{ matrix.function }})
    needs: build
    if: needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambdas-${{ github.run_id }}
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: lambda-${{ matrix.function }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - env:
          FUNCTION_NAME: ${{ env.PROJECT_NAME }}-${{ matrix.function }}
          ZIP_FILE: dist/${{ matrix.function }}.zip
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file "fileb://$ZIP_FILE" \
            --query '{CodeSha256: CodeSha256, LastModified: LastModified}' \
            --output table
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query '{State: State, LastUpdateStatus: LastUpdateStatus}' \
            --output table
