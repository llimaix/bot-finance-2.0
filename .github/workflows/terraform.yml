name: terraform

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      roots:
        description: 'Roots separados por espacio (vacío = todos)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.17.2
  TFLINT_VERSION: v0.66.0
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  # Orden de aplicación por capas. Los roots que aún no existen se ignoran.
  TF_ROOTS_ORDER: >-
    dynamodb secrets
    lambda-app-processor lambda-app-webhook lambda-app-reminder lambda-app-monthly-report
    api-gateway scheduler observability budget

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      roots: ${{ steps.detect.outputs.roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ROOTS: ${{ inputs.roots }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          all=""
          for r in $TF_ROOTS_ORDER; do [ -d "infra/live/$r" ] && all="$all $r"; done

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_ROOTS" ]; then selected="$all"; else
              selected=""
              for r in $all; do for i in $INPUT_ROOTS; do [ "$r" = "$i" ] && selected="$selected $r"; done; done
            fi
          elif [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            selected="$all"   # rama nueva o force push: no hay base fiable para comparar
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            if echo "$changed" | grep -qE '^(\.github/workflows/terraform\.yml|infra/\.tflint\.hcl)$'; then
              selected="$all"
            else
              selected=""
              for r in $all; do
                hit=$(echo "$changed" | grep -c "^infra/live/$r/" || true)
                for m in $(grep -hoE 'source\s*=\s*"\.\./\.\./modules/[^"/]+' "infra/live/$r"/*.tf | sed -E 's#.*modules/##' | sort -u); do
                  hit=$(( hit + $(echo "$changed" | grep -c "^infra/modules/$m/" || true) ))
                done
                [ "$hit" -gt 0 ] && selected="$selected $r"
              done
            fi
          fi

          selected=$(echo $selected)
          echo "roots=$selected" >> "$GITHUB_OUTPUT"
          echo "Roots seleccionados: ${selected:-ninguno}"

  plan:
    needs: detect
    if: needs.detect.outputs.roots != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - id: plan
        env:
          ROOTS: ${{ needs.detect.outputs.roots }}
          # Datos personales: nunca en tfvars (repo público). Solo los roots que
          # declaran la variable la usan; Terraform ignora el resto.
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/plans"
          terraform fmt -check -recursive infra
          changed=""
          for r in $ROOTS; do
            echo "::group::$r"
            cd "$GITHUB_WORKSPACE/infra/live/$r"
            terraform init -lockfile=readonly
            terraform validate
            tflint --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
            set +e
            terraform plan -lock-timeout=5m -detailed-exitcode -out="$GITHUB_WORKSPACE/plans/$r.tfplan"
            rc=$?
            set -e
            if [ "$rc" -eq 1 ]; then exit 1; fi
            if [ "$rc" -eq 2 ]; then
              changed="$changed $r"
              { echo "### $r"; echo '```'; terraform show -no-color "$GITHUB_WORKSPACE/plans/$r.tfplan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              rm -f "$GITHUB_WORKSPACE/plans/$r.tfplan"
              echo "### $r: sin cambios" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "changed=$(echo $changed)" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.changed != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplans-${{ github.run_id }}
          path: plans/
          retention-days: 1
          if-no-files-found: error

  # Puerta de aprobación: sin credenciales de AWS, para que el environment
  # no cambie el "sub" del token OIDC de los jobs que sí asumen el rol.
  approval:
    needs: plan
    if: needs.plan.outputs.changed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: terraform-apply
    steps:
      - env:
          CHANGED: ${{ needs.plan.outputs.changed }}
        run: |
          echo "Aprobado para aplicar: $CHANGED"

  apply:
    needs: [plan, approval]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplans-${{ github.run_id }}
          path: plans

      - env:
          CHANGED: ${{ needs.plan.outputs.changed }}
        run: |
          set -euo pipefail
          for r in $CHANGED; do
            echo "::group::$r"
            cd "$GITHUB_WORKSPACE/infra/live/$r"
            terraform init -lockfile=readonly
            terraform apply -lock-timeout=5m "$GITHUB_WORKSPACE/plans/$r.tfplan"
            echo "::endgroup::"
          done
